name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Build and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/ProtPocket
            git pull origin main
            go build -o server .
            sudo systemctl restart protpocket
